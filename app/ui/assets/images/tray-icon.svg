<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Monochrome notification-area glyph: white diamond with a play cut-out.
       The dark, translucent outline keeps the glyph legible on light panels while
       disappearing against dark ones. Stroke is painted behind the fill so the
       white shape keeps its original geometry at 16 px. -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    stroke="#000000"
    stroke-opacity="0.45"
    stroke-width="1.5"
    stroke-linejoin="round"
    paint-order="stroke fill"
    d="M10.6 2.4Q12 1 13.4 2.4L21.6 10.6Q23 12 21.6 13.4L13.4 21.6Q12 23 10.6 21.6L2.4 13.4Q1 12 2.4 10.6ZM9.5 8L16 12L9.5 16Z"/>
</svg>
